    function renderTickets() {
        const container = document.getElementById('ticketsContainer');
        container.innerHTML = '';
        tickets.forEach(ticket => {
            const btn = document.createElement('button');
            btn.className = 'ticket-btn';
            btn.innerText = `Билет № ${ticket.id}`;
            btn.onclick = () => startTest(ticket.id);
            container.appendChild(btn);
        });
    }

    function startTest(ticketId) {
        const ticket = tickets.find(t => t.id === ticketId);
        if (!ticket) return;

        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('testScreen').style.display = 'block';
        document.getElementById('ticketTitle').innerText = `Билет № ${ticket.id}`;
        document.getElementById('result').style.display = 'none';

        const form = document.getElementById('quizForm');
        form.innerHTML = '';

        ticket.questions.forEach((qId, index) => {
            const q = allQuestions[qId];
            if (!q) return; 
            
            const div = document.createElement('div');
            div.className = 'question';
            div.id = `q-container-${qId}`;
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label>
                        <input type="radio" name="q${qId}" value="${optIndex}">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </label>
                `;
            });

            div.innerHTML = `<h3>${index + 1}. ${q.text}</h3>${optionsHtml}`;
            form.appendChild(div);
        });
    }

    function checkAnswers() {
        const ticketTitle = document.getElementById('ticketTitle').innerText;
        const ticketId = parseInt(ticketTitle.replace(/\D/g, ''));
        const ticket = tickets.find(t => t.id === ticketId);
        
        let score = 0;
        let resultHtml = '';

        ticket.questions.forEach((qId, index) => {
            const q = allQuestions[qId];
            const selected = document.querySelector(`input[name="q${qId}"]:checked`);
            const questionDiv = document.getElementById(`q-container-${qId}`);

            questionDiv.classList.remove('q-correct', 'q-wrong');

            if (selected) {
                const selectedIndex = parseInt(selected.value);
                if (selectedIndex === q.correct) {
                    score++;
                    questionDiv.classList.add('q-correct');
                } else {
                    questionDiv.classList.add('q-wrong');
                    resultHtml += `<p class="wrong">Вопрос ${index + 1}: Неверно. Правильный ответ: ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</p>`;
                }
            } else {
                questionDiv.classList.add('q-wrong');
                resultHtml += `<p class="wrong">Вопрос ${index + 1}: Нет ответа. Правильный ответ: ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</p>`;
            }
        });

        const resultBlock = document.getElementById('result');
        resultBlock.innerHTML = `<h2>Результат: ${score} из ${ticket.questions.length}</h2>` + resultHtml;
        resultBlock.style.display = 'block';
        resultBlock.scrollIntoView({behavior: 'smooth'});
    }

    function goBack() {
        document.getElementById('testScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'block';
        document.getElementById('quizForm').innerHTML = '';
        document.getElementById('result').innerHTML = '';
    }

    window.onload = renderTickets;
</script>
